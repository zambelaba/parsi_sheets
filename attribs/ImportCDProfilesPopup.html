<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Roboto', sans-serif; padding: 20px; 
        background-color: #f9f9f9; color: #333; 
      }
      h2 { font-size: 18px; margin-bottom: 8px; }

      textarea {
        width: 100%; font-size: 14px; padding: 10px; border-radius: 6px;
        border: 1px solid #ccc; background-color: #fff; resize: vertical; 
        min-height: 150px; margin-bottom: 20px;
      }

      button {
        font-size: 14px; padding: 8px 16px; margin-right: 10px;
        border: none; border-radius: 5px; cursor: pointer;
      }
      button:first-of-type { background-color: #007bff; color: white; }
      button:last-of-type  { background-color: #ddd; color: #333; }

      #loading { display: none; margin-top: 30px; text-align: center; }

      .spinner {
        width: 45px; height: 45px; margin: 0 auto 15px auto;
        border: 5px solid #ddd; border-top: 5px solid #1a73e8;
        border-radius: 50%; animation: spin 1s linear infinite;
      }

      .loading-text {
        font-size: 24px; font-weight: 600; color: #444;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .error {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 4px;
        background-color: #fdecea;
        color: #b71c1c;
        font-size: 13px;
        display: none;
      }
    </style>

    <script>
      function showError(message) {
        const box = document.getElementById('errorBox');
        box.textContent = message;
        box.style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      }

      function clearError() {
        const box = document.getElementById('errorBox');
        box.textContent = '';
        box.style.display = 'none';
      }

      function runImport() {
        clearError();

        const input = document.getElementById('inputString').value.trim();
        if (!input) return;

        document.getElementById('content').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.ok === false && res.msg) {
              showError('Failed to import data. ' + res.msg);
              return;
            }
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            let msg = 'Failed to import data.';
            if (err) {
              if (err.message) msg += ' ' + err.message;
              else msg += ' ' + String(err);
            }
            showError(msg);
          })
          .importWithToasts(input);
      }
    </script>
  </head>

  <body>
    <div id="content">
      <div class="description">
        <p>
          ⚠️ This feature is in Beta and may not work perfectly.<br>
          ☑️ Paste your string(s) below and hit "Decode & Paste".<br>
          🟩 Use "*" to combine multiple imports at once.
        </p>
      </div>

      <div id="errorBox" class="error"></div>

      <textarea id="inputString" placeholder="Paste your Fojji Assigns string(s) here..."></textarea>

      <button onclick="runImport()">Decode & Paste</button>
      <button onclick="google.script.host.close()">Cancel</button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">⏳ Importing... please wait.</div>
    </div>
  </body>
</html>
