<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        padding: 20px;
      }
      h2 { text-align: center; }
      label {
        font-weight: bold;
        display: block;
        margin-top: 10px;
      }
      input, select {
        width: 100%;
        padding: 6px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .character-block {
        background: white;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-top: 12px;
      }
      button {
        background-color: #1a73e8;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        margin-top: 20px;
        cursor: pointer;
      }
      button:hover { background-color: #155ab6; }
      #message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 6px;
        display: none;
      }
      #message.success { background: #d4edda; color: #155724; }
      #message.error { background: #f8d7da; color: #721c24; }
      #summary {
        display: none;
        background: #fff;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-top: 15px;
      }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    </style>
  </head>
  <body>
    <h2>Character Submission Form</h2>

    <div id="message"></div>

    <label>Nickname</label>
    <input type="text" id="nickname" required>

    <div id="character-container"></div>

    <button onclick="reviewForm()">Review Submission</button>

    <div id="summary">
      <h3>Confirm Submission</h3>
      <div id="summaryContent"></div>
      <button onclick="confirmSubmit()">Confirm & Submit</button>
      <button onclick="cancelSubmit()" style="background:#888;">Cancel</button>
    </div>

    <script>
      let specs = [];
      let pendingSubmission = null;

      function createCharacterFields() {
        const container = document.getElementById("character-container");
        for (let i = 0; i < 10; i++) {
          const block = document.createElement("div");
          block.className = "character-block";
          block.innerHTML = `
            <label>Character ${i + 1} Name</label>
            <input type="text" id="charName${i}">
            <label>Main Spec</label>
            <select id="mainSpec${i}">
              <option value="">-- Select Spec --</option>
            </select>
            <label>Offspec (optional)</label>
            <select id="offSpec${i}">
              <option value="">None</option>
            </select>`;
          container.appendChild(block);
        }

        specs.forEach(spec => {
          for (let i = 0; i < 10; i++) {
            const mainSelect = document.getElementById("mainSpec" + i);
            const offSelect = document.getElementById("offSpec" + i);
            mainSelect.add(new Option(spec, spec));
            offSelect.add(new Option(spec, spec));
          }
        });
      }

      function showMessage(msg, type = "success") {
        const el = document.getElementById("message");
        el.className = type === "error" ? "error" : "success";
        el.innerText = msg;
        el.style.display = "block";
      }

      function reviewForm() {
        const nickname = document.getElementById("nickname").value.trim();
        if (!nickname) {
          showMessage("Please enter a nickname.", "error");
          return;
        }

        const characters = [];
        for (let i = 0; i < 10; i++) {
          const name = document.getElementById("charName" + i).value.trim();
          const main = document.getElementById("mainSpec" + i).value;
          const off = document.getElementById("offSpec" + i).value;
          if (name && main) characters.push({ characterName: name, mainSpec: main, offSpec: off });
        }

        if (!characters.length) {
          showMessage("Please enter at least one valid character (Name + Main Spec).", "error");
          return;
        }

        pendingSubmission = { nickname, characters };
        const table = characters.map((c, i) =>
          `<tr><td>${i + 1}</td><td>${c.characterName}</td><td>${c.mainSpec}</td><td>${c.offSpec || ""}</td></tr>`
        ).join("");

        document.getElementById("summaryContent").innerHTML =
          `<p><strong>Nickname:</strong> ${nickname}</p>
           <table><tr><th>#</th><th>Character</th><th>Main Spec</th><th>Offspec</th></tr>${table}</table>`;
        document.getElementById("summary").style.display = "block";
      }

      function confirmSubmit() {
        if (!pendingSubmission) return;
        google.script.run
          .withSuccessHandler(msg => {
            showMessage(msg, "success");
            setTimeout(() => google.script.host.close(), 1500);
          })
          .submitForm(pendingSubmission);
      }

      function cancelSubmit() {
        document.getElementById("summary").style.display = "none";
      }

      google.script.run.withSuccessHandler(values => {
        specs = values;
        createCharacterFields();
      }).getSpecs();
    </script>
  </body>
</html>
