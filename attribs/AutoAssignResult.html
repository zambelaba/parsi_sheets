<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #202124;
        background: #fff;
      }
      .wrap { padding: 14px 18px 24px; }
      .headline {
        font-size: 15px;
        font-weight: 600;
        padding: 11px 14px;
        border-radius: 6px;
        border-left: 4px solid;
        margin-bottom: 14px;
      }
      .ok   { background: #e7f5ec; border-color: #1e8e3e; color: #12652b; }
      .fail { background: #fce8e6; border-color: #d93025; color: #a50e0e; }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .07em;
        color: #5f6368;
        margin: 0 0 8px;
        font-weight: 600;
      }
      .count {
        display: inline-block;
        background: #f1f3f4;
        border-radius: 9px;
        padding: 0 7px;
        margin-left: 3px;
        font-size: 11px;
        letter-spacing: 0;
      }
      section { margin-bottom: 18px; }
      ul { margin: 0; padding: 0; list-style: none; }
      li { padding: 2px 0 2px 10px; margin-bottom: 10px; }
      .issues li { border-left: 3px solid #f28b82; }
      .issues .what { color: #a50e0e; }
      .notices li { border-left: 3px solid #c6dafc; }
      .notices .what { color: #3c4043; }
      .notes li { color: #8a5a00; border-left: 3px solid #fdd663; margin-bottom: 8px; }
      .fix { color: #5f6368; font-size: 12px; margin-top: 2px; }
      .places { color: #3c4043; font-size: 12px; margin-top: 2px; }
      .empty { color: #5f6368; font-style: italic; }
      .action {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1a73e8;
        border: 0;
        border-radius: 4px;
        padding: 9px 18px;
        cursor: pointer;
        margin-bottom: 14px;
      }
      .action:hover { background: #1765cc; }
      .action:disabled { background: #9aa0a6; cursor: default; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="headline <?= result.ok ? 'ok' : 'fail' ?>"><?= result.headline ?></div>

      <?
        var sections = [
          { css: 'issues', title: 'Needs attention', items: result.issues || [] },
          { css: 'notes', title: 'Setup notes', items: (result.notes || []).map(function (note) { return { text: note }; }) },
          { css: 'notices', title: 'For your information', items: result.notices || [] },
        ];
      ?>
      <? sections.forEach(function (section) { if (!section.items.length) return; ?>
        <section class="<?= section.css ?>">
          <h2><?= section.title ?> <span class="count"><?= section.items.length ?></span></h2>
          <ul>
            <? section.items.forEach(function (item) { ?>
              <li>
                <div class="what"><? if (item.where) { ?><b><?= item.where ?>:</b> <? } ?><?= item.text ?></div>
                <? if (item.places) { ?><div class="places"><?= item.places ?></div><? } ?>
                <? if (item.fix) { ?><div class="fix"><?= item.fix ?></div><? } ?>
              </li>
            <? }); ?>
          </ul>
        </section>
      <? }); ?>

      <? if (actionFn) { ?>
        <button class="action" id="action" onclick="runAction()"><?= result.action.label ?></button>
        <script>
          function runAction() {
            const button = document.getElementById('action');
            const label = button.textContent;
            button.disabled = true;
            button.textContent = 'Opening…';
            google.script.run
              .withFailureHandler(() => { button.disabled = false; button.textContent = label; })
              .<?!= actionFn ?>();
          }
        </script>
      <? } ?>

      <? if (sections.every(function (section) { return !section.items.length; })) { ?>
        <p class="empty">Nothing needed your attention.</p>
      <? } ?>
    </div>
  </body>
</html>
