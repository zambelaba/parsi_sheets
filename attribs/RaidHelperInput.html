<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
      body { font-family: "Roboto", sans-serif; color: #202124; font-size: 16px; padding: 24px; margin: 0; background: #fff; }
      .icon { font-family: 'Material Symbols Outlined'; font-size: 24px; vertical-align: middle; color: #1a73e8; margin-right: 8px; }
      .field { margin-top: 16px; }
      label { display: block; font-size: 17px; margin-bottom: 4px; color: #5f6368; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; outline: none; }
      input:focus { border-color: #1a73e8; }
      .description { margin: 8px 0 20px; background: #eef2f7; padding: 12px 16px; border-left: 4px solid #ff2a00; border-radius: 6px; font-size: 16px; color: #333; }
      .button-bar { text-align: right; margin-top: 24px; }
      .button { background: #1a73e8; color: white; border: none; padding: 6px 16px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-left: 8px; }
      .button:hover { background: #1669c1; }
      .button.secondary { background: #f1f3f4; color: #202124; }
      .button.secondary:hover { background: #e2e5e9; }
      .error { display: none; margin-top: 12px; padding: 8px 10px; border-radius: 4px; background: #fdecea; color: #b71c1c; font-size: 13px; }
      #loading { display: none; text-align: center; padding-top: 40px; }
      .spinner { width: 60px; height: 60px; margin: 0 auto 15px; border: 5px solid #ddd; border-top-color: #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="form">
      <header><span class="icon">login</span><strong>Import RaidHelper Composition</strong></header>

      <div class="field">
        <label for="raidHelperId">RaidHelper ID</label>
        <input id="raidHelperId" type="text">
      </div>
      <div class="description">
        Open your event in Discord and click the "Comp" button at the bottom of the signup, then copy the numbers at the end of the URL.
      </div>

      <div class="field">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" value="<?= apiKeyMasked ?>">
      </div>
      <div class="description">
        Type "/apikey show" in any channel of your Discord server to get it. Leave it as is to keep the saved key.
      </div>

      <div id="error" class="error"></div>

      <div class="button-bar">
        <button class="button secondary" onclick="google.script.host.close()">Cancel</button>
        <button class="button" onclick="submitForm()">Import</button>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div>Importing RaidHelper data…</div>
    </div>

    <script>
      function setLoading(loading) {
        document.getElementById('form').style.display = loading ? 'none' : 'block';
        document.getElementById('loading').style.display = loading ? 'block' : 'none';
      }

      function showError(message) {
        const box = document.getElementById('error');
        box.textContent = message;
        box.style.display = message ? 'block' : 'none';
      }

      function submitForm() {
        showError('');
        setLoading(true);
        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .withFailureHandler(err => {
            setLoading(false);
            showError('Failed to import RaidHelper data. ' + ((err && err.message) || err || ''));
          })
          .processRaidHelperInput(document.getElementById('raidHelperId').value.trim(), document.getElementById('apiKey').value);
      }
    </script>
  </body>
</html>
