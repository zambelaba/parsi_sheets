<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
      body { font-family: "Roboto", sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; }
      h2 { margin-bottom: 10px; font-size: 17px; }
      select { width: 100%; font-size: 14px; padding: 8px; border-radius: 6px; border: 1px solid #ccc; background-color: #fff; }
      .buttons { margin-top: 20px; text-align: right; }
      .button { font-size: 14px; padding: 8px 16px; border-radius: 5px; border: none; cursor: pointer; }
      .primary { background-color: #1a73e8; color: white; }
      .secondary { background-color: #ddd; color: #333; }
      .primary:hover { background-color: #1669c1; }
      .confirm-box { background:#fff7e6; border:1px solid #ffe599; padding:10px 12px; border-radius:6px; margin-top:12px; font-size:13px; }
      .hidden { display:none; }
      #loading { display:none; text-align:center; padding-top:40px; }
      .spinner { width:45px; height:45px; margin:0 auto 15px auto; border:5px solid #ddd; border-top:5px solid #1a73e8; border-radius:50%; animation:spin 1s linear infinite; }
      .loading-text { font-size:24px; font-weight:600; color:#444; }
      @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    </style>
  </head>
  <body>
    <div id="mainContent">
      <h2>Save Current Assignments</h2>
      <p>Select which slot you’d like to save your current assignments to:</p>

      <select id="slot">
        <? for (var i=0; i<slotsData.length; i++) { var s = slotsData[i]; ?>
          <option value="<?= s.id ?>"><?= s.label ?><?= s.hasData ? ' (occupied)' : '' ?></option>
        <? } ?>
      </select>

      <div id="confirmBox" class="confirm-box hidden">
        ⚠️ This slot already has a saved snapshot. Overwrite it?<br><br>
        <button class="button primary" id="confirmYes">Yes, Overwrite</button>
        <button class="button secondary" id="confirmNo">Cancel</button>
      </div>

      <div class="buttons">
        <button class="button primary" id="save">Save</button>
        <button class="button secondary" onclick="google.script.host.close()">Close</button>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">💾 Saving assignments... please wait.</div>
    </div>

    <script>
      const slotsData = <?!= JSON.stringify(slotsData) ?>;  // <-- matches GS name

      document.getElementById('save').onclick = function () {
        const id = Number(document.getElementById('slot').value);
        const slot = slotsData.find(s => s.id === id);
        if (!slot) return;
        if (slot.hasData) {
          document.getElementById('confirmBox').classList.remove('hidden');
        } else {
          startSave(id);
        }
      };

      document.getElementById('confirmYes').onclick = function () {
        const id = Number(document.getElementById('slot').value);
        startSave(id);
      };

      document.getElementById('confirmNo').onclick = function () {
        document.getElementById('confirmBox').classList.add('hidden');
      };

      function startSave(id) {
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .saveAssignmentsToSlot(id);
      }
    </script>
  </body>
</html>
