<!-- 10M VERSION NEEDS THE .BUTTON-GRID REPEAT TO BE CHANGED TO 2 INSTEAD OF 3 AND ANY GARAJAL RELATED STUFF COMMENTING OUT  -->

<!DOCTYPE html>
<html>
  <head>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <base target="_top">
  <style>
    body { font-family: Roboto, sans-serif; padding: 20px; }
    .section { margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    textarea {
      width: 100%; height: 80px; resize: none;
      font-family: Roboto, sans-serif; padding: 8px;
      border-radius: 6px; border: 1px solid #ccc;
      background-color: #f9f9f9; cursor: pointer;
    }
    .copied { background-color: #d4fcdc; border-color: #4CAF50; }
    .description {
      margin-bottom: 20px; background-color: #eef2f7;
      padding: 12px 16px; border-left: 4px solid #ff2a00;
      border-radius: 6px; font-size: 14px; color: #333;
    }
    h2 { margin-top: 30px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .copy-btn {
      padding: 10px 16px; border-radius: 6px;
      border: none; background-color: #2196F3;
      color: white; cursor: pointer;
      font-size: 14px; transition: background 0.3s;
    }
    .copy-btn.copied {
      background-color: #4CAF50 !important;
    }
  </style>
  <script>
  function copyText(el) {
    el.select();
    navigator.clipboard.writeText(el.value).then(() => {
      el.classList.add('copied');
      setTimeout(() => el.classList.remove('copied'), 500);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    const buttons = document.querySelectorAll('.copy-button');

    buttons.forEach(button => {
      const originalLabel = button.textContent;
      const originalWidth = button.offsetWidth + 'px';
      button.style.minWidth = originalWidth;

      button.addEventListener('click', () => {
        const dataToCopy = button.getAttribute('data-value');
        if (!dataToCopy) return;

        navigator.clipboard.writeText(dataToCopy).then(() => {
          button.textContent = 'Copied!';
          button.style.backgroundColor = '#4CAF50';
          
          setTimeout(() => {
            button.textContent = originalLabel;
            button.style.backgroundColor = '';
          }, 500);
        });
      });
    });
  });

</script>
<style>
  .copy-button {
    font-family: Roboto, sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    margin-right: 10px;
    border: none;
    border-radius: 6px;
    background-color: #007BFF;
    color: white;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    display: inline-block;
    min-width: 100px;
    text-align: center;
  }

  .copy-button:active {
    transform: scale(0.97); 
  }

  .copy-button.copied {
    background-color: #4CAF50 !important;
  }
</style>
</head>
  <body>
    <? if (data.sheetName === "Magtheridon") { ?>
      <h2>Boss Coordinator Data</h2>
      <div class="description">
        ✅ Simply click the data below to copy boss coordinator data. Then paste in the relevant import box in Custom Options of the the Fojji - T4 Weakaura.<br>
      </div>
      
      
      <div class="section">
      <h2>Magtheridon Cube Teams Export</h2>
        <textarea id="roster" onclick="copyText(this)" readonly><?= data.cubeTeams ?></textarea>
      </div>

  <? } else { ?>
    <!-- ===== UNSUPPORTED SHEET ===== -->
    <div class="description">
      <p>
        ❌ This sheet is not supported.<br>
        Please open the Magtheridon tab to use this tool.
      </p>
    </div>
  <? } ?>
  </body>
</html>
